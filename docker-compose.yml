services:
  flask:
    build: .
    container_name: flask-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - redis
    env_file:
      - /home/ubuntu/.env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /home/ubuntu/factsorlie:/app
      - /home/ubuntu/postWolf:/postWolf:ro

  apache:
    build: ./apache
    container_name: apache
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/httpd-vhosts-active.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
      - /home/ubuntu/factsorlie/.well-known:/usr/local/apache2/htdocs/.well-known
      - /home/ubuntu/factsorlie/wolfGuard:/usr/local/apache2/htdocs/wolfGuard:ro
      - /home/ubuntu/lucasbeeler:/usr/local/apache2/htdocs/lucasbeeler:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /etc/ssl/openssl.cnf:/etc/ssl/openssl.cnf:ro
    depends_on:
      - flask

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # Flask reaches this container on the internal factsorlie_default
    # network via hostname "redis"; mtc_server (host-side, not in a
    # container) and MQC helpers call redisConnectWithTimeout(
    # "127.0.0.1", 6379) — so we publish the port on loopback only.
    # Not 0.0.0.0 — redis is never meant to be world-reachable.
    # The native redis-server.service is disabled (we're the single
    # redis on this box).  See postWolf TODO #27.
    ports:
      - "127.0.0.1:6379:6379"
    expose:
      - "6379"
