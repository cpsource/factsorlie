<VirtualHost *:80>
    ServerName factsorlie.com
    ServerAlias www.factsorlie.com

    Alias /.well-known /usr/local/apache2/htdocs/.well-known
    <Directory /usr/local/apache2/htdocs/.well-known>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog /usr/local/apache2/logs/factsorlie-error.log
    CustomLog /usr/local/apache2/logs/factsorlie-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName factsorlie.com
    ServerAlias www.factsorlie.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/factsorlie.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/factsorlie.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://flask:5000/
    ProxyPassReverse / http://flask:5000/

    ErrorLog /usr/local/apache2/logs/factsorlie-ssl-error.log
    CustomLog /usr/local/apache2/logs/factsorlie-ssl-access.log combined
</VirtualHost>
